name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulation:
    name: Migen simulation suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # migen / LiteX / LitePCIe at the exact commits the suite is green on --
      # see requirements-test.txt for why these are pinned. No board, no Vivado
      # and no numpy: the whole suite is pure simulation.
      - name: Install the gateware toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Report toolchain versions
        run: pip list | grep -Ei 'migen|litex|litepcie'

      - name: Run the test suite
        run: PYTHONPATH=. python test/run_all.py
